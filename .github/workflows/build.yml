name: Build Lumen APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/pm17_hype/lumen
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Lumen"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.pm17_hype.lumen"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.pm17_hype.lumen"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val v = "1.3.4"
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.camera:camera-core:$v")
              implementation("androidx.camera:camera-camera2:$v")
              implementation("androidx.camera:camera-lifecycle:$v")
              implementation("androidx.camera:camera-view:$v")
              implementation("androidx.camera:camera-extensions:$v")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application android:label="Lumen Camera" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/pm17_hype/lumen/MainActivity.kt <<'EOF'
          package com.pm17_hype.lumen

          import android.Manifest
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.hardware.camera2.CameraCharacteristics
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import androidx.camera.core.*
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.extensions.ExtensionMode
          import androidx.camera.extensions.ExtensionsManager
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {
              private lateinit var pv: PreviewView
              private lateinit var provider: ProcessCameraProvider
              private lateinit var info: TextView
              private lateinit var lensRow: LinearLayout
              private lateinit var chips: LinearLayout
              private var ext: ExtensionsManager? = null
              private var cam: Camera? = null
              private var cap: ImageCapture? = null
              private var ids = listOf<String>()
              private var labels = listOf<String>()
              private var idx = 0
              private var mode = ExtensionMode.NONE
              private var flash = ImageCapture.FLASH_MODE_OFF
              private var torch = false

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  buildUi()
                  if (checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) init()
                  else requestPermissions(arrayOf(Manifest.permission.CAMERA), 1)
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, g: IntArray) {
                  super.onRequestPermissionsResult(c, p, g)
                  if (g.isNotEmpty() && g[0] == PackageManager.PERMISSION_GRANTED) init() else toast("Camera permission is needed")
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun LinearLayout.addB(t: String, f: (Button) -> Unit) {
                  val b = Button(this@MainActivity).apply {
                      text = t; isAllCaps = false; setTextColor(Color.WHITE); textSize = 13f
                      setBackgroundColor(Color.argb(136, 0, 0, 0))
                  }
                  b.setOnClickListener { f(b) }
                  addView(b, LinearLayout.LayoutParams(-2, -2).apply { setMargins(4, 4, 4, 4) })
              }

              private fun scroll(row: LinearLayout) = HorizontalScrollView(this).apply { addView(row) }

              private fun buildUi() {
                  pv = PreviewView(this)
                  val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  root.addView(pv, FrameLayout.LayoutParams(-1, -1))
                  val sd = ScaleGestureDetector(this, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      override fun onScale(d: ScaleGestureDetector): Boolean { zoomBy(d.scaleFactor); return true }
                  })
                  pv.setOnTouchListener { _, e ->
                      sd.onTouchEvent(e)
                      if (e.action == MotionEvent.ACTION_UP && !sd.isInProgress) {
                          val p = pv.meteringPointFactory.createPoint(e.x, e.y)
                          cam?.cameraControl?.startFocusAndMetering(FocusMeteringAction.Builder(p).build())
                      }
                      true
                  }
                  val ui = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.BOTTOM; setPadding(16, 16, 16, 64) }
                  info = TextView(this).apply { setTextColor(Color.WHITE); textSize = 13f; setPadding(8, 0, 0, 0) }
                  lensRow = LinearLayout(this)
                  chips = LinearLayout(this)
                  val modes = LinearLayout(this)
                  modes.addB("Auto") { mode = ExtensionMode.NONE; bind() }
                  modes.addB("HDR") { mode = ExtensionMode.HDR; bind() }
                  modes.addB("Night") { mode = ExtensionMode.NIGHT; bind() }
                  modes.addB("Portrait") { mode = ExtensionMode.BOKEH; bind() }
                  modes.addB("Flash: Off") { b ->
                      flash = when (flash) {
                          ImageCapture.FLASH_MODE_OFF -> ImageCapture.FLASH_MODE_AUTO
                          ImageCapture.FLASH_MODE_AUTO -> ImageCapture.FLASH_MODE_ON
                          else -> ImageCapture.FLASH_MODE_OFF
                      }
                      b.text = "Flash: " + listOf("Auto", "On", "Off")[flash]
                  }
                  modes.addB("Torch") { torch = !torch; cam?.cameraControl?.enableTorch(torch) }
                  val shutter = Button(this).apply { text = "●"; textSize = 30f; setOnClickListener { shoot() } }
                  ui.addView(info)
                  ui.addView(scroll(lensRow))
                  ui.addView(scroll(chips))
                  ui.addView(scroll(modes))
                  ui.addView(shutter, LinearLayout.LayoutParams(220, 220).apply { gravity = Gravity.CENTER_HORIZONTAL })
                  root.addView(ui, FrameLayout.LayoutParams(-1, -1))
                  setContentView(root)
              }

              private fun init() {
                  val f = ProcessCameraProvider.getInstance(this)
                  f.addListener({
                      provider = f.get()
                      val ef = ExtensionsManager.getInstanceAsync(this, provider)
                      ef.addListener({
                          ext = ef.get()
                          lenses()
                          bind()
                      }, ContextCompat.getMainExecutor(this))
                  }, ContextCompat.getMainExecutor(this))
              }

              /* every camera Android lets this app see, with its real focal length */
              private fun lenses() {
                  val l = provider.availableCameraInfos
                  ids = l.map { Camera2CameraInfo.from(it).cameraId }
                  labels = l.map { ci ->
                      val c2 = Camera2CameraInfo.from(ci)
                      val face = if (c2.getCameraCharacteristic(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_FRONT) "Front" else "Back"
                      val f = c2.getCameraCharacteristic(CameraCharacteristics.LENS_INFO_AVAILABLE_FOCAL_LENGTHS)?.firstOrNull()
                      val s = c2.getCameraCharacteristic(CameraCharacteristics.SENSOR_INFO_PHYSICAL_SIZE)
                      val eq = if (f != null && s != null) " " + Math.round(f * 43.27 / Math.hypot(s.width.toDouble(), s.height.toDouble())) + "mm" else ""
                      "$face ID" + c2.cameraId + eq
                  }
                  idx = labels.indexOfFirst { it.startsWith("Back") }.coerceAtLeast(0)
                  lensRow.removeAllViews()
                  labels.forEachIndexed { i, t -> lensRow.addB(t) { idx = i; bind() } }
                  if (labels.isEmpty()) toast("No cameras found")
              }

              private fun bind() {
                  if (ids.isEmpty()) return
                  val cid = ids[idx]
                  var sel = CameraSelector.Builder()
                      .addCameraFilter(CameraFilter { l -> l.filter { Camera2CameraInfo.from(it).cameraId == cid } })
                      .build()
                  val em = ext
                  if (mode != ExtensionMode.NONE && em != null) {
                      if (em.isExtensionAvailable(sel, mode)) sel = em.getExtensionEnabledCameraSelector(sel, mode)
                      else { toast("This mode is not available on this lens"); mode = ExtensionMode.NONE }
                  }
                  val prev = Preview.Builder().build().also { it.setSurfaceProvider(pv.surfaceProvider) }
                  val cb = ImageCapture.Builder().setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY).setJpegQuality(100)
                  if (mode == ExtensionMode.NONE) cb.setResolutionSelector(
                      ResolutionSelector.Builder()
                          .setAspectRatioStrategy(AspectRatioStrategy.RATIO_4_3_FALLBACK_AUTO_STRATEGY)
                          .setAllowedResolutionMode(ResolutionSelector.PREFER_HIGHER_RESOLUTION_OVER_CAPTURE_RATE)
                          .build())
                  val ic = cb.build()
                  torch = false
                  try {
                      provider.unbindAll()
                      cam = provider.bindToLifecycle(this, sel, prev, ic)
                      cap = ic
                      cam!!.cameraInfo.zoomState.observe(this) { z ->
                          info.text = labels[idx] + "  " + String.format("%.1f", z.zoomRatio) + "x"
                      }
                      zoomChips()
                  } catch (e: Exception) {
                      toast("Cannot open this lens: " + e.message)
                  }
              }

              private fun zoomChips() {
                  chips.removeAllViews()
                  val z = cam?.cameraInfo?.zoomState?.value ?: return
                  listOf(0.5f, 0.6f, 1f, 2f, 3f, 5f, 10f, 20f, 30f, 50f, 100f)
                      .filter { it >= z.minZoomRatio - 0.01f && it <= z.maxZoomRatio + 0.01f }
                      .forEach { r -> chips.addB(r.toString() + "x") { zoomTo(r) } }
              }

              private fun zoomTo(r: Float) {
                  val c = cam ?: return
                  val s = c.cameraInfo.zoomState.value ?: return
                  c.cameraControl.setZoomRatio(r.coerceIn(s.minZoomRatio, s.maxZoomRatio))
              }

              private fun zoomBy(f: Float) {
                  val s = cam?.cameraInfo?.zoomState?.value ?: return
                  zoomTo(s.zoomRatio * f)
              }

              /* saves straight into Gallery: Pictures/Lumen */
              private fun shoot() {
                  val c = cap ?: return
                  val name = "LUMEN_" + SimpleDateFormat("yyyyMMdd_HHmmss_SSS", Locale.US).format(Date())
                  val cv = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Lumen")
                  }
                  val o = ImageCapture.OutputFileOptions.Builder(contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv).build()
                  c.flashMode = flash
                  c.takePicture(o, ContextCompat.getMainExecutor(this), object : ImageCapture.OnImageSavedCallback {
                      override fun onImageSaved(r: ImageCapture.OutputFileResults) { toast("Saved to Gallery") }
                      override fun onError(e: ImageCaptureException) { toast("Error: " + e.message) }
                  })
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Lumen.apk
          gh release create "v${{ github.run_number }}" Lumen.apk --title "Lumen build ${{ github.run_number }}" --notes "Install Lumen.apk"
